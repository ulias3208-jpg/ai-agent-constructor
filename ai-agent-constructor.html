<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор личного AI-агента</title>
  <meta name="description" content="Одностраничный конструктор промпта для личного AI-агента.">
  <meta name="theme-color" content="#101512">
  <style>
    :root {
      --ink: #101512;
      --muted: #59635d;
      --paper: #f7f3e8;
      --panel: #fffdf7;
      --line: #1a211d;
      --field: #f4f8f3;
      --green: #1f7a5f;
      --lime: #c8f45f;
      --cyan: #37c8d4;
      --coral: #ef6a4a;
      --violet: #6d5bd0;
      --shadow: 10px 10px 0 rgba(16, 21, 18, 0.13);
      --radius: 8px;
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: "Segoe UI", "Trebuchet MS", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
      background:
        linear-gradient(135deg, rgba(16, 21, 18, 0.055) 25%, transparent 25%) 0 0 / 22px 22px,
        linear-gradient(315deg, rgba(16, 21, 18, 0.045) 25%, transparent 25%) 0 0 / 22px 22px,
        linear-gradient(110deg, #f7f3e8 0%, #edf7ec 42%, #fff7ee 100%);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 34px;
    }

    .topline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    .brand {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: center;
      min-width: 0;
    }

    .mark {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, transparent 46%, rgba(16, 21, 18, 0.18) 47%, transparent 49%),
        linear-gradient(145deg, var(--lime), var(--cyan));
      box-shadow: 5px 5px 0 rgba(16, 21, 18, 0.16);
      font-size: 30px;
      font-weight: 900;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5.5vw, 4.9rem);
      line-height: 0.96;
      letter-spacing: 0;
      max-width: 820px;
    }

    .tag {
      justify-self: end;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 800;
      box-shadow: 4px 4px 0 rgba(16, 21, 18, 0.12);
      white-space: nowrap;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1.03fr) minmax(360px, 0.97fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      border-bottom: 2px solid var(--line);
      padding: 16px 18px;
      background:
        linear-gradient(90deg, rgba(200, 244, 95, 0.45), rgba(55, 200, 212, 0.2)),
        var(--panel);
    }

    .panel-head h2 {
      font-size: 1.02rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .counter {
      min-width: 46px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-size: 0.82rem;
      font-weight: 900;
    }

    form {
      display: grid;
      gap: 16px;
      padding: 18px;
    }

    .ready-block {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(200, 244, 95, 0.22), rgba(239, 106, 74, 0.1)),
        #fffefa;
    }

    .ready-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .ready-title span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: none;
    }

    .ready-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }

    .ready-agent {
      display: grid;
      gap: 4px;
      min-height: 78px;
      padding: 10px;
      text-align: left;
      color: var(--ink);
      background: #f6fbf4;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 3px 3px 0 rgba(16, 21, 18, 0.13);
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .ready-agent strong {
      font-size: 0.92rem;
      line-height: 1.15;
    }

    .ready-agent small {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .ready-agent:hover,
    .ready-agent.is-active {
      background: #eaff9f;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 rgba(16, 21, 18, 0.18);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    label {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--ink);
    }

    input,
    textarea,
    select {
      width: 100%;
      min-width: 0;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: var(--field);
      color: var(--ink);
      outline: none;
      padding: 12px 13px;
      transition: box-shadow 150ms ease, transform 150ms ease, background 150ms ease;
    }

    textarea {
      min-height: 94px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(55, 200, 212, 0.28);
      transform: translate(-1px, -1px);
    }

    .tasks {
      display: grid;
      gap: 10px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 10px;
      align-items: center;
    }

    .task-index {
      height: 42px;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: var(--cyan);
      font-weight: 900;
      box-shadow: 3px 3px 0 rgba(16, 21, 18, 0.12);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-top: 2px;
    }

    .primary,
    .copy {
      min-height: 48px;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      font-weight: 900;
      box-shadow: 5px 5px 0 rgba(16, 21, 18, 0.18);
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
    }

    .primary {
      background: linear-gradient(90deg, var(--lime), #e7ff95 52%, var(--cyan));
      padding: 0 20px;
    }

    .copy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 138px;
      background: #ffffff;
      padding: 0 15px;
    }

    .primary:hover,
    .copy:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 rgba(16, 21, 18, 0.2);
      filter: saturate(1.05);
    }

    .primary:active,
    .copy:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 rgba(16, 21, 18, 0.2);
    }

    .output-panel {
      position: sticky;
      top: 18px;
    }

    .output-panel .panel-head {
      background:
        linear-gradient(90deg, rgba(239, 106, 74, 0.22), rgba(109, 91, 208, 0.16)),
        var(--panel);
    }

    .prompt-wrap {
      padding: 18px;
    }

    .prompt {
      min-height: 610px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(rgba(16, 21, 18, 0.035) 1px, transparent 1px) 0 0 / 100% 28px,
        #fffefa;
      padding: 18px;
      font: 0.95rem/1.62 "Consolas", "Courier New", monospace;
      color: #17211f;
    }

    .prompt.empty {
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      font-family: var(--font-body);
      font-weight: 800;
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      color: var(--green);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .footer {
      display: flex;
      justify-content: center;
      padding-top: 22px;
    }

    .gift-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      padding: 12px 18px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 5px 5px 0 rgba(16, 21, 18, 0.18);
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
      text-align: center;
    }

    .gift-link:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 rgba(16, 21, 18, 0.22);
      background: #243129;
    }

    ::selection {
      background: var(--lime);
      color: var(--ink);
    }

    @media (max-width: 920px) {
      .topline,
      .shell {
        grid-template-columns: 1fr;
      }

      .tag {
        justify-self: start;
      }

      .output-panel {
        position: static;
      }

      .prompt {
        min-height: 440px;
      }
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 22px, 1180px);
        padding-top: 14px;
      }

      .brand {
        grid-template-columns: 1fr;
      }

      .mark {
        width: 50px;
        height: 50px;
        font-size: 25px;
      }

      .grid-2,
      .ready-grid,
      .actions {
        grid-template-columns: 1fr;
      }

      .copy {
        width: 100%;
      }

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .task-row {
        grid-template-columns: 34px 1fr;
      }

      .task-index {
        height: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="brand">
        <div class="mark" aria-hidden="true">AI</div>
        <h1>Конструктор личного AI-агента</h1>
      </div>
      <div class="tag">1 файл · без сервера</div>
    </header>

    <section class="shell" aria-label="Конструктор промпта">
      <div class="panel">
        <div class="panel-head">
          <h2>Параметры агента</h2>
          <span class="counter">01</span>
        </div>

        <form id="agentForm">
          <div class="ready-block" aria-label="Готовые агенты">
            <div class="ready-title">
              Готовые агенты
              <span>выбери и редактируй</span>
            </div>
            <div class="ready-grid">
              <button class="ready-agent" type="button" data-agent="week">
                <strong>Планировщик недели</strong>
                <small>дела, фокус, энергия</small>
              </button>
              <button class="ready-agent" type="button" data-agent="habits">
                <strong>Тренер привычек</strong>
                <small>режим, спорт, забота</small>
              </button>
              <button class="ready-agent" type="button" data-agent="career">
                <strong>Карьерный навигатор</strong>
                <small>работа, рост, решения</small>
              </button>
              <button class="ready-agent" type="button" data-agent="content">
                <strong>Контент-редактор</strong>
                <small>посты, идеи, тексты</small>
              </button>
              <button class="ready-agent" type="button" data-agent="study">
                <strong>Учебный наставник</strong>
                <small>обучение, практика</small>
              </button>
              <button class="ready-agent" type="button" data-agent="money">
                <strong>Финансовый помощник</strong>
                <small>бюджет, цели, траты</small>
              </button>
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label for="agentName">Имя агента</label>
              <input id="agentName" name="agentName" type="text" placeholder="Например: Нора" autocomplete="off">
            </div>

            <div class="field">
              <label for="lifeArea">Сфера жизни</label>
              <input id="lifeArea" name="lifeArea" type="text" placeholder="Работа, здоровье, обучение">
            </div>
          </div>

          <div class="field">
            <label for="mainGoal">Главная цель</label>
            <textarea id="mainGoal" name="mainGoal" placeholder="Какой результат агент помогает получать регулярно"></textarea>
          </div>

          <div class="field">
            <label>4 задачи агента</label>
            <div class="tasks">
              <div class="task-row">
                <span class="task-index">1</span>
                <input name="task" type="text" placeholder="Первая конкретная задача">
              </div>
              <div class="task-row">
                <span class="task-index">2</span>
                <input name="task" type="text" placeholder="Вторая конкретная задача">
              </div>
              <div class="task-row">
                <span class="task-index">3</span>
                <input name="task" type="text" placeholder="Третья конкретная задача">
              </div>
              <div class="task-row">
                <span class="task-index">4</span>
                <input name="task" type="text" placeholder="Четвёртая конкретная задача">
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label for="tone">Стиль общения</label>
              <select id="tone" name="tone">
                <option value="бережно, спокойно и по делу">Бережно и по делу</option>
                <option value="энергично, прямо и с короткими шагами">Энергично и прямо</option>
                <option value="как наставник: структурно, тепло и требовательно">Наставник</option>
                <option value="лаконично, без лишних объяснений">Лаконично</option>
                <option value="дружелюбно, с лёгким юмором и поддержкой">Дружелюбно</option>
              </select>
            </div>

            <div class="field">
              <label for="limits">Что агенту нельзя делать</label>
              <textarea id="limits" name="limits" placeholder="Например: давить, обещать невозможное, решать за меня"></textarea>
            </div>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Собрать агента</button>
            <button class="copy" id="copyButton" type="button" aria-label="Скопировать готовый промпт">
              <span aria-hidden="true">⧉</span>
              <span>Копировать</span>
            </button>
          </div>
        </form>
      </div>

      <aside class="panel output-panel" aria-label="Готовый промпт">
        <div class="panel-head">
          <h2>Готовый промпт</h2>
          <span class="counter">02</span>
        </div>
        <div class="prompt-wrap">
          <div class="prompt empty" id="promptOutput" aria-live="polite">
            Нажмите «Собрать агента», чтобы получить готовый промпт.
          </div>
          <div class="status" id="copyStatus" aria-live="polite"></div>
        </div>
      </aside>
    </section>

    <footer class="footer">
      <a class="gift-link" id="giftLink" href="#" target="_blank" rel="noopener">
        Подарить конструктор людям ↗
      </a>
    </footer>
  </main>

  <script>
    const form = document.getElementById("agentForm");
    const promptOutput = document.getElementById("promptOutput");
    const copyButton = document.getElementById("copyButton");
    const copyStatus = document.getElementById("copyStatus");
    const giftLink = document.getElementById("giftLink");
    const readyButtons = Array.from(document.querySelectorAll("[data-agent]"));

    const readyAgents = {
      week: {
        agentName: "Планировщик недели",
        lifeArea: "дела, фокус и личная эффективность",
        mainGoal: "помогать мне выбирать главное, планировать неделю без перегруза и доводить важные задачи до результата",
        tasks: [
          "выделять 3 главных приоритета недели",
          "раскладывать задачи по дням с учетом времени и сил",
          "помогать переносить дела, если план стал слишком плотным",
          "в конце дня кратко подводить итоги и выбирать следующий шаг"
        ],
        tone: "лаконично, без лишних объяснений",
        limits: "загружать день нереалистичным списком, ругать за срывы, игнорировать отдых"
      },
      habits: {
        agentName: "Тренер привычек",
        lifeArea: "здоровье, режим и устойчивые привычки",
        mainGoal: "помогать мне внедрять полезные привычки маленькими шагами и не бросать после первых срывов",
        tasks: [
          "разбивать привычку на минимальное действие на сегодня",
          "отслеживать прогресс без давления и чувства вины",
          "находить причины срывов и мягко менять план",
          "предлагать простые ритуалы для сна, движения, питания или восстановления"
        ],
        tone: "бережно, спокойно и по делу",
        limits: "стыдить, давить мотивацией, давать медицинские обещания или жесткие диеты"
      },
      career: {
        agentName: "Карьерный навигатор",
        lifeArea: "карьера, работа и профессиональный рост",
        mainGoal: "помогать мне принимать карьерные решения, усиливать позиционирование и двигаться к более интересной работе",
        tasks: [
          "разбирать рабочие ситуации и варианты решений",
          "помогать формулировать достижения, опыт и сильные стороны",
          "готовить меня к собеседованиям, переговорам и сложным разговорам",
          "собирать план развития навыков на ближайшие недели"
        ],
        tone: "как наставник: структурно, тепло и требовательно",
        limits: "принимать решения за меня, обещать быстрый карьерный скачок, писать неправду в резюме"
      },
      content: {
        agentName: "Контент-редактор",
        lifeArea: "контент, личный бренд и публичные тексты",
        mainGoal: "помогать мне превращать мысли и опыт в ясные посты, идеи, сценарии и тексты для аудитории",
        tasks: [
          "находить темы и сильные углы подачи",
          "собирать структуру текста: крючок, смысл, пример, вывод",
          "редактировать черновики так, чтобы они звучали живо",
          "предлагать варианты заголовков, финалов и призывов к действию"
        ],
        tone: "дружелюбно, с лёгким юмором и поддержкой",
        limits: "делать текст пафосным, использовать канцелярит, придумывать факты обо мне"
      },
      study: {
        agentName: "Учебный наставник",
        lifeArea: "обучение, новые навыки и саморазвитие",
        mainGoal: "помогать мне разбираться в сложных темах простым языком и закреплять знания практикой",
        tasks: [
          "объяснять тему простыми словами и на примерах",
          "давать короткие упражнения после объяснения",
          "проверять понимание вопросами",
          "собирать план повторения, чтобы знания не забывались"
        ],
        tone: "как наставник: структурно, тепло и требовательно",
        limits: "переходить к сложным терминам без объяснения, давать слишком много теории за раз, высмеивать ошибки"
      },
      money: {
        agentName: "Финансовый помощник",
        lifeArea: "личные финансы, бюджет и денежные цели",
        mainGoal: "помогать мне видеть картину денег, планировать траты и двигаться к финансовым целям спокойнее",
        tasks: [
          "помогать составлять бюджет на месяц",
          "находить лишние траты без обвинений",
          "разбивать финансовую цель на понятные шаги",
          "готовить вопросы для более осознанных покупок"
        ],
        tone: "бережно, спокойно и по делу",
        limits: "давать инвестиционные гарантии, стыдить за траты, принимать финансовые решения вместо меня"
      }
    };

    const clean = (value, fallback) => {
      const text = String(value || "").trim();
      return text || fallback;
    };

    const getTasks = () => {
      const inputs = Array.from(form.querySelectorAll('input[name="task"]'));
      return inputs.map((input, index) => clean(input.value, `Задача ${index + 1}: уточнить вместе со мной`));
    };

    const buildPrompt = () => {
      const data = new FormData(form);
      const name = clean(data.get("agentName"), "Личный AI-агент");
      const area = clean(data.get("lifeArea"), "важная для меня сфера жизни");
      const goal = clean(data.get("mainGoal"), "помогать мне стабильно двигаться к главному результату");
      const tone = clean(data.get("tone"), "бережно, спокойно и по делу");
      const limits = clean(data.get("limits"), "не давить, не обещать невозможное, не принимать решения вместо меня");
      const tasks = getTasks();

      return `Ты — ${name}, мой личный AI-агент в сфере «${area}».

Главная цель:
${goal}

Твои 4 ключевые задачи:
1. ${tasks[0]}
2. ${tasks[1]}
3. ${tasks[2]}
4. ${tasks[3]}

Стиль общения:
Общайся со мной ${tone}. Пиши ясно, человечно и конкретно. Если информации не хватает, задай 1-3 коротких вопроса. Если можно действовать сразу, предложи первый маленький шаг.

Границы:
Тебе нельзя: ${limits}.

Как работать со мной:
- Сначала кратко оцени ситуацию.
- Затем предложи понятный план на ближайшее действие.
- Разделяй большие цели на маленькие шаги.
- Подсвечивай риски и слепые зоны без драматизации.
- В конце каждого ответа давай один самый полезный следующий шаг.

Начни с вопроса: «Что сейчас важнее всего улучшить в сфере “${area}”?»`;
    };

    const renderPrompt = (message = "Промпт собран.") => {
      promptOutput.textContent = buildPrompt();
      promptOutput.classList.remove("empty");
      copyStatus.textContent = message;
    };

    const applyReadyAgent = (key) => {
      const agent = readyAgents[key];
      if (!agent) return;

      form.elements.agentName.value = agent.agentName;
      form.elements.lifeArea.value = agent.lifeArea;
      form.elements.mainGoal.value = agent.mainGoal;
      form.elements.tone.value = agent.tone;
      form.elements.limits.value = agent.limits;

      Array.from(form.querySelectorAll('input[name="task"]')).forEach((input, index) => {
        input.value = agent.tasks[index] || "";
      });

      readyButtons.forEach((button) => {
        const isActive = button.dataset.agent === key;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      renderPrompt(`Готовый агент выбран: ${agent.agentName}.`);
    };

    const copyText = async (text) => {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    };

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      renderPrompt();
      promptOutput.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    readyButtons.forEach((button) => {
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => applyReadyAgent(button.dataset.agent));
    });

    copyButton.addEventListener("click", async () => {
      if (promptOutput.classList.contains("empty")) {
        renderPrompt();
      }

      try {
        await copyText(promptOutput.textContent);
        copyStatus.textContent = "Готово: промпт скопирован.";
      } catch (error) {
        copyStatus.textContent = "Не получилось скопировать автоматически. Выделите текст вручную.";
      }
    });

    const pageUrl = window.location.protocol === "file:"
      ? "https://proba-gilt.vercel.app"
      : window.location.href;
    const giftText = "Собери личного AI-агента за пару минут";
    giftLink.href = `https://t.me/share/url?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent(giftText)}`;
  </script>
</body>
</html>
